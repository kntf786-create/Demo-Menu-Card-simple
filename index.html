<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice Route Bistro - Digital Menu</title>
    <link rel="preload" as="image" href="Screenshot_2026-11-26-20-04-41-66_99c04817c0de5652397fc8b56c3b3817.jpg">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- Front Cover Screen -->
        <div id="cover-screen" class="screen active">
            <div class="cover-wrapper">
                <img src="Screenshot_2026-11-26-20-04-41-66_99c04817c0de5652397fc8b56c3b3817.jpg" alt="Spice Route Menu" class="full-img" fetchpriority="high">
                
                <!-- Invisible Touch Hotspots jo image ke 4 buttons ke upar fit hain -->
                <div class="hotspot-stack">
                    <button class="hotspot-btn" aria-label="Starters" onclick="openCategory('starter')"></button>
                    <button class="hotspot-btn" aria-label="Main Course" onclick="openCategory('mainCourse')"></button>
                    <button class="hotspot-btn" aria-label="Desserts" onclick="openCategory('desserts')"></button>
                    <button class="hotspot-btn" aria-label="Refreshments" onclick="openCategory('refreshments')"></button>
                </div>
            </div>
        </div>

        <!-- Full-Screen Flipbook Screen -->
        <div id="flipbook-screen" class="screen">
            <!-- Floating Minimal Header -->
            <div class="floating-header">
                <button class="glass-btn" onclick="goHome()">← Menu</button>
                <span id="page-indicator" class="glass-badge">1 / 3</span>
            </div>

            <!-- Full-Screen 3D Book -->
            <div class="book-stage" id="book-stage">
                <div class="book" id="book"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

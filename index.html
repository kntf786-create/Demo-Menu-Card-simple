<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spice Route Bistro - Digital Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="menu-wrapper" id="app">
    <!-- FRONTEND / MAIN MENU PAGE -->
    <div class="home-screen" id="homeScreen">
        <img src="Screenshot_2026-11-26-20-04-41-66_99c04817c0de5652397fc8b56c3b3817.jpg" alt="Spice Route Bistro Menu" class="home-bg">

        <!-- 4 Category Buttons Mapped Over Image -->
        <button class="hotspot" id="btn-starters" onclick="openCategory('starters')" aria-label="Starters"></button>
        <button class="hotspot" id="btn-maincourse" onclick="openCategory('mainCourse')" aria-label="Main Course"></button>
        <button class="hotspot" id="btn-desserts" onclick="openCategory('desserts')" aria-label="Desserts"></button>
        <button class="hotspot" id="btn-refreshment" onclick="openCategory('refreshments')" aria-label="Refreshments"></button>
    </div>

    <!-- FLIPBOOK SCREEN -->
    <div class="flipbook-screen" id="flipbookScreen">
        <!-- Back Arrow Button to Return to Frontend -->
        <button class="back-btn" onclick="goHome()" aria-label="Back to Menu">
            <svg viewBox="0 0 24 24">
                <path d="M19 12H5"></path>
                <path d="M12 19l-7-7 7-7"></path>
            </svg>
        </button>

        <!-- Touch/Click Zones for Quick Page Flip -->
        <div class="nav-zone nav-left" onclick="prevPage()"></div>
        <div class="nav-zone nav-right" onclick="nextPage()"></div>

        <!-- 3D Book Pages Container -->
        <div class="book-container" id="bookContainer"></div>

        <!-- Page Indicator Dots -->
        <div class="page-dots" id="pageDots"></div>
    </div>
</div>

<script src="menudata.js"></script>
</body>
</html>
